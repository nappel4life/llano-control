name: Prüfen und Pakete bauen

# Was hier passiert:
#   pruefen  - Protokolltests auf Linux und Windows, die Oberflaeche ohne Bildschirm
#   linux    - Debian-Paket, AppImage und die tragbare Mappe
#   windows  - Installer aus Inno Setup, mit einem Testlauf des fertigen Programms
#   dateien  - auf einen Marken-Tag (v1.0.0) eine Veroeffentlichung mit allen Stuecken
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pruefen:
    name: Prüfen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Protokoll, Kurve und Einstellungen
        run: python -m unittest discover -s tests -v

      - name: Byte-Folien passen noch zum Protokoll
        # Die Rust-Fassung prueft gegen tests/byte-vektoren.json. Aendert sich
        # das Python-Protokoll, muss die Datei mit erzeugt und mitgeschickt
        # werden - sonst prueft Rust ein Protokoll, das es nicht mehr gibt.
        run: python tools/protokoll-vektoren.py --pruefen

      - name: Was Rechner und Kuehler zusammen koennen
        run: python -m llanotool selftest
        continue-on-error: true          # ohne eingesteckten Kuehler kein Fehler

      - name: Schnittstellensuche gegen Windows gezaehlt
        # Ein Kuehler haengt hier nicht, aber ein echtes Windows. Die eigene
        # Aufzaehlung neben die von Windows zu legen beantwortet deshalb mehr
        # als jede Geratemeldung: sieht unsere Suche nur nichts, oder ist auf
        # diesem Rechner wirklich nichts zu sehen.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from llanotool import device; [print(z) for z in device.backend.scan_report()]"
          "HID-Geraete laut Windows: " + (Get-PnpDevice -Class HIDClass -PresentOnly | Measure-Object).Count
        continue-on-error: true

      - name: Oberflaeche ohne Bildschirm
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip PyQt6
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0
          QT_QPA_PLATFORM=offscreen python tools/gui_probe.py /tmp/oberflaeche.png

      - name: Pruefbild ablegen
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pruefbild
          path: /tmp/oberflaeche*.png
          if-no-files-found: ignore

  rust:
    name: Rust-Unterbau
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Der Bauwagen bringt Rust mit; rustfmt und clippy kommen selten vor.
      - name: Werkzeuge
        run: |
          rustup component add rustfmt clippy
          rustup target add x86_64-pc-windows-msvc

      - name: Form und Warnungen
        working-directory: rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Das Windows-Ziel zumindest durch den Seher
        # Hier steht kein Windows-Rechner mit Kuehler; was der Bauwagen tun
        # kann, ist zu schauen, dass Layouts, Aufrufweiten und Breiten fuer das
        # Windows-Ziel stimmen. Der Installer wird spaeter auf einem
        # Windows-Bauwagen gebaut, das Geraet selbst probiert jemand aus.
        working-directory: rust
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Pruefungen
        working-directory: rust
        run: cargo test

      - name: Selbstpruefung auf dem Bauwagen
        # Der Bauwagen hat keinen Kuehler eingesteckt; dass das Programm
        # trotzdem durchlaeuft und den fehlenden Kuehler benennt, ist die Aussage.
        working-directory: rust
        run: cargo run -q -- selftest || true

  linux:
    name: Linux-Pakete
    runs-on: ubuntu-22.04        # aeltere Glibc: laeuft dann auch auf aelteren Systemen
    needs: pruefen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version bestimmen
        run: bash packaging/version.sh >> "$GITHUB_ENV"

      - name: Werkzeuge
        run: |
          python -m pip install --upgrade pip pyinstaller PyQt6
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg fakeroot

      - name: Rust-Werkzeug bauen
        # Die Kommandozeile `llano-rs` kommt als zweites Programm mit ins Paket
        # und in die tragbare Mappe. Ohne cargo hier blieb das schon einmal
        # still weg, deshalb die Pruefung danach.
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          ls -l rust/target/release/llano-rs

      - name: Tragbare Mappe
        run: bash packaging/build-portable.sh

      - name: AppImage
        run: bash packaging/build-appimage.sh

      - name: Debian-Paket
        run: bash packaging/build-deb.sh

      - name: Bauen und gleich ausprobieren
        run: |
          sudo dpkg -i out/llano-control_*_all.deb
          llano selftest || true
          out/llano-control-*-x86_64.AppImage --appimage-extract-and-run selftest || true
          tar -tzf out/llano-control-*-linux-*.tar.gz | head -3
          dpkg-deb --info out/llano-control_*_all.deb | head -20

      - name: Dateien fuers Verzeichnis
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            out/*.deb
            out/*.AppImage
            out/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows-Installer
    needs: pruefen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Version bestimmen
        shell: bash
        run: bash packaging/version.sh >> "$GITHUB_ENV"

      - name: Werkzeuge
        run: |
          python -m pip install --upgrade pip pyinstaller PyQt6
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Messhilfe fuer CPU-Temperaturen dazulegen
        # Windows gibt die Prozesstemperatur nur an ein Programm mit
        # Kernel-Treiber heraus. Statt auf ein fremdes Programm zu verweisen,
        # liegt die Messhilfe (LibreHardwareMonitorLib) deshalb im Installer
        # mit bei - zusammen mit einem zwanzig Kilobyte kleinen Helfer, der
        # sie im Auftrag des Steuerprogramms fragt. Uebersetzt wird mit dem
        # Compiler, den Windows selbst mitbringt; die Bibliothek ist eine
        # .NET-Framework-4.7.2-Baugruppe, und die hat jeder aktuelle Windows-
        # Rechner schon an Bord.
        #
        # Die Fassung 0.9.6 liest den Prozessor ueber den signierten Treiber
        # PawnIO. Den legt nur das komplette Programm dazu (Haken im Setup),
        # die Bibliothek allein meldet ohne ihn Grafikkarte und Mainboard und
        # sagt, dass ihr der Treiber fehlt - die Oberflaeche gibt das weiter,
        # statt eine leere Liste zu zeigen.
        shell: pwsh
        run: |
          $Fassung = "v0.9.6"
          $Grund = "https://github.com/LibreHardwareMonitor/LibreHardwareMonitor"
          $Datum = "$env:RUNNER_TEMP\messhilfe.zip"
          $Ausgepackt = "$env:RUNNER_TEMP\entpackt"
          Invoke-WebRequest "$Grund/releases/download/$Fassung/LibreHardwareMonitor.zip" -OutFile $Datum
          "Gepruefte Datei: " + (Get-FileHash $Datum -Algorithm SHA256).Hash
          Remove-Item -Recurse -Force $Ausgepackt -ErrorAction SilentlyContinue
          Expand-Archive $Datum -DestinationPath $Ausgepackt
          # Die Lizenztexte gehoert mit, weil die Lizenz der Messhilfe das
          # verlangt - und weil jemand, der den Ordner im Programmordner
          # oeffnet, sehen soll, was hier fremd ist und woher es kommt.
          foreach ($Stueck in "LICENSE", "THIRD-PARTY-NOTICES.txt") {
            Invoke-WebRequest "https://raw.githubusercontent.com/LibreHardwareMonitor/LibreHardwareMonitor/$Fassung/$Stueck" -OutFile "$Ausgepackt\$Stueck"
          }
          # Der Rest ist Sache des Skripts, damit Bauautomatik und ein Bau von
          # Hand dasselbe tun: Helfer uebersetzen, Bausteine sortieren,
          # Selbstversuch. Das Skript bricht ab, wenn der Helfer nicht redet.
          ./packaging/messhilfe/bauen.ps1 -Entpackt $Ausgepackt

      - name: Programmdateien bauen
        run: pyinstaller --noconfirm --clean packaging/llano.spec

      - name: Rust-Werkzeug bauen
        # llano-rs.exe neben llano.exe: dieselbe Einstellungsdatei, derselbe
        # Dienst, nur ohne Qt. Am Windows-Geraet war dieser Pfad noch nicht -
        # ausprobiert wird er von jemandem mit dem Kuehler am Rechner.
        shell: bash
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          # `out/` legt sonst erst der Installerbau an, und diese Mappe hier
          # soll die einzelne Datei schon vor ihm enthalten.
          mkdir -p out
          cp rust/target/release/llano-rs.exe dist/llano-control/
          cp rust/target/release/llano-rs.exe out/
          ls -l dist/llano-control/llano-rs.exe out/

      - name: Das gebaute Programm ansehen
        shell: bash
        run: |
          dist/llano-control/llano.exe selftest || true
          ls dist/llano-control | head

      - name: Oberflaeche startet wirklich
        # Der einzige Test, der zaehlt, ist der Doppelklick auf einem echten
        # Windows - und der geschah bisher ausschliesslich bei jemandem, der
        # den Kuehler am Kabel hat. Ein Programm, dessen Fenster nie aufgeht,
        # ist aber kein Programm. Also auch hier: starten, laufen lassen, und
        # wenn von selbst aufhoert, die Fehlerausgabe zeigen.
        shell: pwsh
        run: |
          $fehler = "$env:RUNNER_TEMP\oberflaeche-fehler.txt"
          $prozess = Start-Process -FilePath "$PWD\dist\llano-control\llano-control.exe" `
              -ArgumentList "--minimized" -PassThru -RedirectStandardError $fehler
          if ($prozess.WaitForExit(40000)) {
            "Die Oberflaeche hat von sich aus beendet (Rueckgabe $($prozess.ExitCode)):"
            Get-Content $fehler
            exit 1
          }
          $prozess.Kill()
          if ((Get-Item $fehler).Length -gt 0) { Get-Content $fehler }
          "Die Oberflaeche lief nach 40 Sekunden noch - gut."
        continue-on-error: true

      - name: Installer bauen
        shell: bash
        run: |
          # Ein "/" vor DVersion wuerde die Git-Msys-Schale in einen Dateipfad
          # verwandeln, und Inno Setup haelt das fuer eine zweite Bau-Vorschrift.
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "-DVersion=$VERSION" packaging/windows/llano.iss
          ls -l out

      - name: Installer pruefen
        shell: bash
        run: |
          ls -l out
          test -s out/llano-control-*-windows-amd64.exe

      - name: Installer wirklich installieren
        # Ausprobiert wurde bisher immer die gebaute Mappe aus dist/, nie das,
        # was wirklich heruntergeladen und doppelgeklickt wird. Dazwischen
        # liegt der Installer, und was der beim Aktualisieren an alter Datei
        # liegen laesst oder zuwenig mitnimmt, zeigt sich erst beim Nutzer -
        # ohne Fenster und ohne eine einzige geschriebene Datei.
        shell: pwsh
        run: |
          $setup = (Get-Item out/llano-control-*-windows-amd64.exe).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          "Rueckgabe des Installers: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          $programme = "C:\Program Files\llano-control"
          # Die Selbstdiagnose ist die einzige Stelle, die alles zusammen sieht:
          # der installierte Helfer, seine Bibliothek, der Treiber, die Rechte.
          # Sie steht deshalb hier - und sie muss von der Messhilfe erzehlen,
          # sonst ist der Ordner ein leeres Versprechen.
          $bericht = & "$programme\llano.exe" selftest 2>&1 | Out-String
          "Rueckgabe der Selbstdiagnose: $LASTEXITCODE - ohne Kuehler am Bauwagen ist 1 hier richtig"
          $bericht
          # Die Powershell-Schale der Bauautomatik endet mit der letzten
          # Rueckgabe, und die Selbstdiagnose meldet ohne Geraet 1 - ohne diese
          # Zeile schlüge ein gelungener Install als Fehler an.
          $global:LASTEXITCODE = 0
          if ($bericht -notmatch "Messhilfe\s+:") {
            "Die installierte Selbstdiagnose sagt nichts ueber die Messhilfe."
            exit 1
          }
          if ($bericht -notmatch "llano-messhilfe.exe") {
            "Der installierte Helfer wird nicht gefunden."
            exit 1
          }
          $protokoll = "$env:RUNNER_TEMP\install-oberflaeche.txt"
          $oberflaeche = Start-Process "$programme\llano-control.exe" -ArgumentList "--minimized" -PassThru -RedirectStandardError $protokoll
          if ($oberflaeche.WaitForExit(40000)) {
            "Die installierte Oberflaeche hat von sich aus beendet:"
            Get-Content $protokoll
            Get-Content "$env:APPDATA\llano\oberflaeche.txt" -ErrorAction SilentlyContinue
            Get-Content "$env:APPDATA\llano\oberflaeche-fehler.txt" -ErrorAction SilentlyContinue
            exit 1
          }
          $oberflaeche.Kill()
          if (-not (Test-Path "$env:APPDATA\llano\config.json")) {
            "Die installierte Oberflaeche hat keine Einstellungsdatei hinterlassen."
          }
          "Die installierte Oberflaeche lief nach 40 Sekunden - gut."

          # Die mitgebrachte Messhilfe haengt an keinem Haken, sie muss also
          # immer im Ordner liegen - und zwar mit ihrem Helfer, nicht nur mit
          # der Bibliothek.
          if (-not (Test-Path "$programme\messhilfe\llano-messhilfe.exe")) {
            "Die mitgebrachte Messhilfe ist nicht im Installationsordner."
            Get-ChildItem $programme | Select-Object -ExpandProperty Name
            exit 1
          }
          "Messhilfe im Ordner: " + ((Get-ChildItem "$programme\messhilfe" |
              Measure-Object).Count) + " Dateien, " +
            [math]::Round(((Get-ChildItem "$programme\messhilfe" -Recurse |
              Measure-Object Length -Sum).Sum / 1MB), 1) + " MB"
          # Der Haken ist standardmaessig an, also muss auch das komplette
          # Programm liegen. Ob es aus den dabeigelegten Einstellungen heraus
          # wirklich antwortet, wird danach gefragt - nicht angeklickt.
          $hilfe = "$programme\helfer\LibreHardwareMonitor.exe"
          if (-not (Test-Path $hilfe)) {
            "Der Haken war an, aber das Messprogramm wurde nicht installiert."
            Get-ChildItem $programme | Select-Object -ExpandProperty Name
            exit 1
          }
          "Messprogramm installiert: " + ((Get-ChildItem "$programme\helfer" |
              Measure-Object).Count) + " Dateien"
          Start-Process $hilfe | Out-Null
          $antwort = $null
          for ($versuch = 1; $versuch -le 30; $versuch++) {
            Start-Sleep -Seconds 1
            try {
              $antwort = Invoke-RestMethod "http://127.0.0.1:8085/data.json" -TimeoutSec 3
              break
            } catch { }
          }
          if ($null -eq $antwort) {
            # Der Bauwagen hat weder Prozessor noch Mainboard-Sensoren, und sein
            # Treiber darf dort womoeglich nicht laden. Eine fehlende Antwort ist
            # hier also eine Warnung, kein Grund, nichts herauszugeben - dass die
            # Dateien und ihre Einstellungen da sind, steht oben schon fest.
            "ACHTUNG: die Messhilfe antwortete in 30 Sekunden nicht auf Port 8085."
            Get-Content "$programme\helfer\LibreHardwareMonitor.config" -ErrorAction SilentlyContinue
          } else {
            "Messhilfe antwortet: Knoten " + $antwort.Text + " mit " +
              @($antwort.Children).Count + " Unterknoten"
            & "$programme\llano.exe" sensors
            $global:LASTEXITCODE = 0
          }
          & "$env:SystemRoot\System32\taskkill.exe" /F /IM LibreHardwareMonitor.exe 2>$null | Out-Null
          & "$env:SystemRoot\System32\taskkill.exe" /F /IM llano-messhilfe.exe 2>$null | Out-Null

      - name: Dateien fuers Verzeichnis
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.exe
          if-no-files-found: error

  veroeffentlichen:
    name: Veröffentlichen
    runs-on: ubuntu-latest
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        run: bash packaging/version.sh >> "$GITHUB_ENV"

      - name: Gebautes holen
        uses: actions/download-artifact@v4
        with:
          # Nur die fertigen Dateien, nicht die Pruefbilder aus dem Testlauf.
          pattern: "{linux,windows}"
          path: stuecke
          merge-multiple: true

      - name: Zusammenstellen, was dabei ist
        run: |
          ls -l stuecke
          {
            echo "### Dateien"
            echo
            for f in stuecke/*; do
              [ -f "$f" ] || continue
              printf -- '- `%s` (%s)\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Veroeffentlichung anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "llano-control $VERSION" \
            --generate-notes \
            stuecke/*
