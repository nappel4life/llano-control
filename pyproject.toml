[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llano-control"
version = "1.1.11"
description = "Den llano V12 Ultra Notebookkuehler steuern: Luefterkurve, LEDs, Effekte"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["llano", "v12 ultra", "notebookkuehler", "cooling pad", "hid", "fan curve"]
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "nappel4life" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
    "Topic :: System :: Hardware",
]
# Die Steuerung selbst braucht nichts ausser der Standardbibliothek.
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.4"]

[project.scripts]
llano = "llanotool.cli:main"

[project.urls]
Homepage = "https://github.com/nappel4life/llano-control"
Issues = "https://github.com/nappel4life/llano-control/issues"

[tool.setuptools]
packages = ["llanotool"]
